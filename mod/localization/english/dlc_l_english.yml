l_english:
 # Domainwright — every string the mod shows.
 dlc_domain_limit_interaction:0 "Domain Limit…"
 dlc_domain_limit_interaction_desc:0 "Raise or lower #EMP $CHARACTER$'s#! [domain_limit|E]. The change rides on top of their natural limit, so perks and titles still count."

 # Layer 1 menu
 dlc_menu.0001.t:0 "The Domain Wright"
 dlc_menu.0001.desc_no_delta:0 "[ROOT.Char.GetTitledFirstName] holds [ROOT.Char.GetDomainSize] [holdings|E] against a natural [domain_limit|E] of [ROOT.Char.GetDomainLimit].\n\nNo override is in place. Each rung you add is an ordinary [domain_limit|E] modifier, so the penalties, the tooltip and the AI all read it as real."
 dlc_menu.0001.desc_capped:0 "#EMP This government caps the [domain_limit|E].#! Its own rules set a ceiling on the computed limit, so rungs above that ceiling will not appear. The override is still applied and is still real; it is simply outranked."
 dlc_menu.0001.desc_with_delta:0 "[ROOT.Char.GetTitledFirstName] holds [ROOT.Char.GetDomainSize] [holdings|E]. The override is #high [ROOT.Char.MakeScope.Var('dlc_delta').GetValue|0]#! on top of the natural limit.\n\nEach rung is an ordinary [domain_limit|E] modifier: the tooltip lists it, the over-limit penalties count it, and the AI acts on it."
 dlc_menu.0001.minus_five:0 "Lower the limit by #EMP 5#!"
 dlc_menu.0001.minus_one:0 "Lower the limit by #EMP 1#!"
 dlc_menu.0001.plus_one:0 "Raise the limit by #high 1#!"
 dlc_menu.0001.plus_five:0 "Raise the limit by #high 5#!"
 dlc_menu.0001.reset:0 "Clear the override"
 dlc_menu.0001.reset_all:0 "#EMP Clear every override in the world#!"
 dlc_menu.0001.open_window:0 "Open the Domainwright window"
 dlc_menu.0001.close:0 "Leave it be"

 # Layer 2 window
 dlc_window_title:0 "Domainwright"
 dlc_window_help:0 "Rungs of the ladder, applied to you. Each is a real domain_limit modifier."
 dlc_window_delta_readout:0 "Current override: [GetPlayer.MakeScope.Var('dlc_delta').GetValue|0]"
 dlc_window_minus_five:0 "−5"
 dlc_window_minus_one:0 "−1"
 dlc_window_plus_one:0 "+1"
 dlc_window_plus_five:0 "+5"
 dlc_window_reset:0 "Clear"
 dlc_window_close:0 "Close"

