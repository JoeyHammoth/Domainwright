name: validate

# Semantic validation with ck3-tiger. Needs vanilla game files, which cannot live
# in a public repository, so this runs on a self-hosted runner only.
#
# Security: never run this on pull_request. A self-hosted runner attached to a
# public repo can execute fork code. Keep it to protected-branch pushes and
# manual dispatch (see SECURITY.md).
# Manual only until a self-hosted runner is registered: a push-triggered job with
# no runner queues forever and reports nothing. Add the push trigger back once the
# runner in SECURITY.md exists.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tiger:
    runs-on: [self-hosted, windows, ck3]
    steps:
      - uses: actions/checkout@v4

      - name: Check the tiger executable is configured
        shell: pwsh
        run: |
          if (-not $env:TIGER_PATH) {
            Write-Error "Repository variable TIGER_PATH is not set. See docs/modding-notes.md."
            exit 1
          }

      - name: Static checks
        shell: pwsh
        run: python tools/check_structure.py mod/

      - name: ck3-tiger against the reviewed baseline
        shell: pwsh
        run: |
          & $env:TIGER_PATH --suppress tests/static/tiger-baseline.json mod/descriptor.mod
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ck3-tiger reported problems not present in the baseline."
            exit $LASTEXITCODE
          }
