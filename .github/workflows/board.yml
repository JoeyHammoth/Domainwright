name: board

# Keeps the Domainwright project in step with issue state: a new or reopened issue lands in
# Todo, a closed one in Done. The project number defaults to 10 (the repo-linked board) and
# can be overridden with a repository variable named PROJECT_NUMBER.
#
# Needs a repository secret named PROJECT_TOKEN: a personal access token allowed to read and
# write Projects. A fine-grained token needs "Projects: read and write" on the owner account;
# a classic token needs the `project` scope. Without the secret the job warns and exits green,
# so forks and pull requests are unaffected. See CONTRIBUTING.md.

on:
  issues:
    types: [opened, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync issue state to the project board
        uses: actions/github-script@v9
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER || '10' }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN || github.token }}
          script: |
            const owner = process.env.PROJECT_OWNER;
            const number = Number(process.env.PROJECT_NUMBER);

            if (!process.env.PROJECT_TOKEN) {
              core.warning('PROJECT_TOKEN is not set; the board was not updated. See CONTRIBUTING.md.');
              return;
            }

            const meta = await github.graphql(`
              query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 20) {
                      nodes { ... on ProjectV2SingleSelectField { id name options { id name } } }
                    }
                  }
                }
              }`, { owner, number });

            const project = meta.user.projectV2;
            if (!project) {
              core.setFailed(`No project number ${number} for ${owner}`);
              return;
            }

            const statusField = project.fields.nodes.find((f) => f && f.name === 'Status');
            if (!statusField) {
              core.setFailed('The project has no single-select field named Status');
              return;
            }

            const optionId = (name) => {
              const found = statusField.options.find((o) => o.name === name);
              if (!found) throw new Error(`Status option "${name}" not found`);
              return found.id;
            };
            const TODO = optionId('Todo');
            const DONE = optionId('Done');

            async function syncOne(contentId, state) {
              // addProjectV2ItemById is idempotent: an item that already exists is returned
              // rather than duplicated, so this doubles as a lookup.
              const added = await github.graphql(`
                mutation($project: ID!, $content: ID!) {
                  addProjectV2ItemById(input: { projectId: $project, contentId: $content }) {
                    item { id }
                  }
                }`, { project: project.id, content: contentId });
              const itemId = added.addProjectV2ItemById.item.id;

              await github.graphql(`
                mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $project
                    itemId: $item
                    fieldId: $field
                    value: { singleSelectOptionId: $option }
                  }) { projectV2Item { id } }
                }`, {
                project: project.id,
                item: itemId,
                field: statusField.id,
                option: state === 'closed' ? DONE : TODO,
              });
            }

            if (context.eventName === 'issues') {
              const issue = context.payload.issue;
              if (issue.pull_request) {
                core.info('Pull requests are not board items; nothing to do.');
                return;
              }
              await syncOne(issue.node_id, issue.state);
              core.info(`#${issue.number} (${issue.state}) synced to the board.`);
            } else {
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                per_page: 100,
              });
              const real = issues.filter((i) => !i.pull_request);
              for (const issue of real) {
                await syncOne(issue.node_id, issue.state);
              }
              core.info(`${real.length} issues synced to the board.`);
            }
